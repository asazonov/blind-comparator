<title>Blind Comparator BC-10 — Electric Guitar Listening Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --grille:#221d18; --chassis:#100e0c; --chassis-2:#1e1a16;
  --panel-hi:#d6ba78; --panel:#bb9d5c; --panel-lo:#9a7d40; --panel-edge:#6d5628;
  --ink:#20190d; --ink-2:#54462a;
  --cream:#e9e0c9; --cream-2:#9a8e76;
  --lamp:#e8442c; --lamp-hi:#ff9a72;
  --ok:#6d8f4a; --ok-hi:#a8c97e;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:30px 14px 70px;color:var(--cream);
  font:400 15px/1.55 Barlow,system-ui,sans-serif;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.022) 0 2px,transparent 2px 5px),
    repeating-linear-gradient(-45deg,rgba(0,0,0,.30) 0 2px,transparent 2px 5px),
    radial-gradient(130% 80% at 50% 0%,#342a20 0%,var(--grille) 58%,#151109 100%);
  background-attachment:fixed;
}
.rack{max-width:770px;margin:0 auto;position:relative;
  background:linear-gradient(180deg,var(--chassis-2),var(--chassis));
  border:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 26px 70px rgba(0,0,0,.66)}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#6e6559,#2a251f 70%);
  box-shadow:inset 0 0 3px #000,0 1px 0 rgba(255,255,255,.08)}
.screw::after{content:"";position:absolute;inset:4px 1px;background:#141210;transform:rotate(35deg)}
.screw.tl{top:12px;left:12px}.screw.tr{top:12px;right:12px}
.screw.bl{bottom:12px;left:12px}.screw.br{bottom:12px;right:12px}

.chassis{display:flex;align-items:center;gap:16px;padding:20px 34px;
  border-bottom:1px solid #000;background:linear-gradient(180deg,#262119,#16130f)}
.lamp{width:15px;height:15px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#712014,#38100a 70%);
  box-shadow:inset 0 0 6px rgba(0,0,0,.9),0 0 0 3px #1c1814,0 0 0 4px #000;transition:.3s}
.lamp.on{background:radial-gradient(circle at 35% 30%,var(--lamp-hi),var(--lamp) 55%,#8c1d10);
  box-shadow:inset 0 0 5px rgba(0,0,0,.4),0 0 0 3px #1c1814,0 0 0 4px #000,0 0 20px 3px rgba(232,68,44,.55)}
.badge{flex:1;min-width:0}
.badge-name{font:700 22px/1 "Saira Condensed",sans-serif;letter-spacing:.17em;text-transform:uppercase}
.badge-model{font:400 10px/1.5 "Space Mono",monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--cream-2);margin-top:5px}
.counter{font:400 11px/1.4 "Space Mono",monospace;letter-spacing:.12em;color:var(--cream-2);text-align:right;white-space:nowrap}

.panel{margin:20px;padding:26px 24px;color:var(--ink);
  border:1px solid var(--panel-edge);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--panel-hi) 0%,var(--panel) 44%,var(--panel-lo) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.28),0 6px 20px rgba(0,0,0,.45)}
.foot{padding:15px 34px 19px;font:400 10.5px/1.6 "Space Mono",monospace;
  letter-spacing:.06em;color:#6f6656;border-top:1px solid #000}
.silk{font:700 10px/1 "Saira Condensed",sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2)}
.rule{height:1px;background:rgba(32,25,13,.3);margin:12px 0 16px}
h1{font:700 33px/1.05 "Saira Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase;margin:12px 0 10px}
h2{font:700 21px/1.1 "Saira Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
p{margin:0 0 12px;max-width:60ch}
.dim{color:var(--ink-2)}
.mono{font-family:"Space Mono",monospace}

.leds{display:flex;gap:7px;margin:0 0 18px}
.led{width:9px;height:9px;border-radius:50%;background:rgba(32,25,13,.42);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.led.hit{background:radial-gradient(circle at 35% 30%,var(--ok-hi),var(--ok));box-shadow:0 0 7px rgba(109,143,74,.75)}
.led.miss{background:radial-gradient(circle at 35% 30%,var(--lamp-hi),var(--lamp));box-shadow:0 0 7px rgba(232,68,44,.65)}

.clip{display:flex;align-items:center;gap:13px;padding:10px 12px;margin-top:7px;
  border:1px solid rgba(32,25,13,.26);background:rgba(255,255,255,.11)}
.play{width:33px;height:33px;flex:none;border:1px solid #000;cursor:pointer;padding:0;
  background:linear-gradient(180deg,#3d362b,#1c1812);color:var(--cream);
  display:grid;place-items:center;font-size:11px;line-height:1}
.play:hover{background:linear-gradient(180deg,#4d4335,#252017)}
.play:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cliplabel{font:700 10px/1 "Saira Condensed",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);width:52px;flex:none}
.track{flex:1;height:5px;background:rgba(32,25,13,.34);position:relative;cursor:pointer;min-width:40px}
.track:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--ink)}
.time{font:400 11px/1 "Space Mono",monospace;color:var(--ink-2);min-width:78px;text-align:right;flex:none}

.opt{display:block;width:100%;text-align:left;margin-top:7px;padding:12px 15px;cursor:pointer;
  border:1px solid var(--panel-edge);color:var(--ink);font:500 15px/1.3 Barlow,sans-serif;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(0,0,0,.05))}
.opt .mk{font:400 11px "Space Mono",monospace;letter-spacing:.1em;color:var(--ink-2);margin-right:11px}
.opt .brand{font-weight:600}
.opt:hover:not(:disabled){background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(0,0,0,.01))}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt:disabled{cursor:default;opacity:.5}
.opt.correct{opacity:1;color:#111806;border-color:#4a6630;background:linear-gradient(180deg,#9dbd76,#6d8f4a)}
.opt.wrong{opacity:1;color:#2b0c07;border-color:#8c1d10;background:linear-gradient(180deg,#e5806d,#c4402a)}
.opt .tag{float:right;font:700 10px/1.6 "Saira Condensed",sans-serif;letter-spacing:.18em;text-transform:uppercase}

.btn{display:inline-block;margin-top:18px;padding:13px 26px;cursor:pointer;
  border:1px solid #000;color:var(--cream);font:700 12px/1 "Saira Condensed",sans-serif;
  letter-spacing:.22em;text-transform:uppercase;
  background:linear-gradient(180deg,#3d362b,#1c1812);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.5)}
.btn:hover{background:linear-gradient(180deg,#4d4335,#252017)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.reveal{margin-top:18px;padding:16px 18px;border:1px solid rgba(32,25,13,.34);background:rgba(32,25,13,.09)}
.reveal a{color:var(--ink);text-underline-offset:3px}
.spec{font:400 11px/1.7 "Space Mono",monospace;color:var(--ink-2)}

.meterwrap{text-align:center;margin:6px 0 4px}
svg.meter{width:100%;max-width:430px;height:auto}
.needle{transition:transform 1.5s cubic-bezier(.22,1.4,.36,1)}
.verdict{font:700 25px/1.15 "Saira Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;margin:6px 0 8px}

.bias{margin-top:16px;padding:15px 18px;border:1px solid rgba(32,25,13,.34);background:rgba(32,25,13,.09)}
.biasval{font:700 27px/1.1 "Saira Condensed",sans-serif;letter-spacing:.05em;margin:5px 0 6px}
.biasnote{margin-bottom:7px}
td.delta,th.tnum{text-align:right;white-space:nowrap}
td.delta{font:400 11.5px/1.5 "Space Mono",monospace;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
th{font:700 9.5px/1 "Saira Condensed",sans-serif;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);text-align:left;padding:0 8px 7px 0;border-bottom:1px solid rgba(32,25,13,.34)}
td{padding:8px 8px 8px 0;border-bottom:1px solid rgba(32,25,13,.16);vertical-align:top}
td a{color:var(--ink)}
.rnum{font:400 11px "Space Mono",monospace;color:var(--ink-2);width:26px}
.mark{font-weight:700}
.mark.y{color:#3d5a1e}.mark.n{color:#8c1d10}

[hidden]{display:none!important}
@media (max-width:560px){
  body{padding:14px 8px 44px}
  .chassis{padding:16px 20px;gap:12px}.panel{margin:12px;padding:20px 15px}
  .badge-name{font-size:18px}h1{font-size:26px}
  .foot{padding:13px 20px 16px}
  .cliplabel{width:42px;letter-spacing:.14em}.time{min-width:70px;font-size:10px}
  td.delta,th.tnum{display:none}
  .biasval{font-size:23px}
  .screw{display:none}
}
@media (prefers-reduced-motion:reduce){
  .needle{transition:none}.lamp{transition:none}
}
</style>
</head>
<body>
<div class="rack">
  <span class="screw tl"></span><span class="screw tr"></span>

  <header class="chassis">

  <!-- TEST -->

    <div class="rule"></div>

  <!-- RESULT -->

    <div class="meterwrap">
      <svg class="meter" id="meter" viewBox="0 0 420 250" role="img" aria-labelledby="metertitle">
        <title id="metertitle">Score meter</title>
      </svg>
    </div>
    <div class="verdict" id="verdict"></div>
    <p id="stats"></p>
    <div id="bias"></div>
    <table>
      <thead><tr><th></th><th>The instrument</th><th>You said</th><th class="tnum">Over / under (€)</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <button class="btn" id="again">Run another test</button>
  </section>

  <footer class="foot">Recordings are cross-linked from Thomann</footer>
</div>

const N_ROUNDS = 10, N_OPTS = 5;
const $ = s => document.querySelector(s);

// Epiphone is Gibson's budget line and Squier is Fender's — same designs, so they
// belong in the same bucket rather than being a giveaway.
// family is decided at build time: Epiphone sits with Gibson, Squier with Fender,
// and each Harley Benton / Larry Carlton with whatever its model copies.
const fam = g => g.f;
const BY_FAM = POOL.reduce((m,g)=>((m[fam(g)] = m[fam(g)] || []).push(g), m), {});
// a round needs the answer plus four same-family decoys
const ELIGIBLE = POOL.filter(g => BY_FAM[fam(g)].length >= N_OPTS);


const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmt = t => (isFinite(t)? Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0") : "0:00");
const name = g => g.b + " " + g.m;

function choose(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}
function pAtLeast(k,n,p){let s=0;for(let i=k;i<=n;i++)s+=choose(n,i)*Math.pow(p,i)*Math.pow(1-p,n-i);return s}

let rounds=[], idx=0, picks=[], audios=[];

function buildRounds(){
  const answers = shuffle(ELIGIBLE).slice(0,N_ROUNDS);
  return answers.map(ans=>{
    const decoys = shuffle(BY_FAM[fam(ans)].filter(g=>g.a!==ans.a)).slice(0,N_OPTS-1);
    return { ans, opts: shuffle([ans,...decoys]) };
  });
}

function stopAll(except){
  audios.forEach(a=>{ if(a!==except){ a.pause(); } });
}
function lampSync(){ $('#lamp').classList.toggle('on', audios.some(a=>!a.paused && !a.ended)); }

function renderClips(g){
  const wrap=$('#clips'); wrap.innerHTML=''; audios=[];
  g.s.forEach((s,i)=>{
    const row=document.createElement('div'); row.className='clip';
    const audio=new Audio(); audio.preload='none'; audio.src=s.u; audios.push(audio);

    const btn=document.createElement('button');
    btn.className='play'; btn.type='button';
    btn.setAttribute('aria-label','Play clip '+String.fromCharCode(65+i));
    btn.textContent='▶';

    const lab=document.createElement('span');
    lab.className='cliplabel'; lab.textContent='Clip '+String.fromCharCode(65+i);

    const track=document.createElement('div');
    track.className='track'; track.tabIndex=0; track.setAttribute('role','slider');
    track.setAttribute('aria-label','Seek clip '+String.fromCharCode(65+i));
    const fill=document.createElement('div'); fill.className='fill'; track.appendChild(fill);

    const time=document.createElement('span');
    time.className='time'; time.textContent='0:00 / '+fmt(s.d);

    btn.onclick=()=>{ if(audio.paused){ stopAll(audio); audio.play(); } else audio.pause(); };
    audio.onplay =()=>{ btn.textContent='‖'; lampSync(); };
    audio.onpause=()=>{ btn.textContent='▶'; lampSync(); };
    audio.onended=()=>{ btn.textContent='▶'; fill.style.width='0%'; lampSync(); };
    audio.ontimeupdate=()=>{
      const d=audio.duration||s.d;
      fill.style.width=(100*audio.currentTime/d)+'%';
      time.textContent=fmt(audio.currentTime)+' / '+fmt(d);
    };
    const seek=e=>{
      const r=track.getBoundingClientRect();
      const d=audio.duration||s.d;
      audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*d;
    };
    track.onclick=seek;
    track.onkeydown=e=>{
      const d=audio.duration||s.d;
      if(e.key==='ArrowRight'){audio.currentTime=Math.min(d,audio.currentTime+3);e.preventDefault();}
      if(e.key==='ArrowLeft'){audio.currentTime=Math.max(0,audio.currentTime-3);e.preventDefault();}
      if(e.key===' '||e.key==='Enter'){btn.click();e.preventDefault();}
    };

    row.append(btn,lab,track,time); wrap.appendChild(row);
  });
}

function renderLeds(){
  const l=$('#leds'); l.innerHTML='';
  for(let i=0;i<N_ROUNDS;i++){
    const d=document.createElement('span'); d.className='led';
    if(picks[i]) d.classList.add(picks[i].ok?'hit':'miss');
    l.appendChild(d);
  }
}

function renderRound(){
  const r=rounds[idx];
  $('#counter').textContent='ROUND '+String(idx+1).padStart(2,'0')+' / '+N_ROUNDS;
  renderLeds(); renderClips(r.ans);
  $('#reveal').innerHTML='';
  const box=$('#opts'); box.innerHTML='';
  r.opts.forEach((g,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.type='button';
    b.innerHTML='<span class="mk">'+String.fromCharCode(49+i)+'</span>'+
                '<span class="brand">'+g.b+'</span> '+g.m;
    b.onclick=()=>answer(g,b);
    box.appendChild(b);
  });
}

function answer(pick,btn){
  const r=rounds[idx], ok=pick.a===r.ans.a;
  picks[idx]={pick,ok};
  [...$('#opts').children].forEach((b,i)=>{
    b.disabled=true;
    const g=r.opts[i];
    if(g.a===r.ans.a){ b.classList.add('correct'); b.insertAdjacentHTML('beforeend','<span class="tag">correct</span>'); }
    else if(b===btn){ b.classList.add('wrong'); b.insertAdjacentHTML('beforeend','<span class="tag">your pick</span>'); }
  });
  renderLeds();
  const g=r.ans;
  $('#reveal').innerHTML =
    '<div class="reveal"><h2>'+(ok?'Correct':'Not that one')+'</h2>'+
    '<div style="margin:2px 0 8px">It was the <strong>'+name(g)+'</strong>.</div>'+
    '<div class="spec">'+(g.eur?'≈ €'+g.eur.toLocaleString('en-US')+' / $'+g.usd.toLocaleString('en-US')+' · ':'')+
    g.s.length+' clip'+(g.s.length>1?'s':'')+
    ' · <a href="'+g.url+'" target="_blank" rel="noopener">product page ↗</a></div>'+
    '<button class="btn" id="next">'+(idx===N_ROUNDS-1?'See report':'Next instrument')+'</button></div>';
  $('#next').onclick=()=>{ stopAll(null); lampSync(); idx++; idx<N_ROUNDS?renderRound():showResult(); };
  $('#next').focus();
}

// ---- meter -------------------------------------------------------------
const CX=210, CY=214, R=132;
const ang = v => -62 + (124*v/N_ROUNDS);              // degrees from vertical
const pol = (r,v) => { const t=ang(v)*Math.PI/180; return [CX+r*Math.sin(t), CY-r*Math.cos(t)]; };
const arc = (r,v0,v1) => { const a=pol(r,v0),b=pol(r,v1); return `M${a[0].toFixed(1)} ${a[1].toFixed(1)} A${r} ${r} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; };

function drawMeter(score){
  const s=$('#meter'); let h='';
  h+=`<rect x="8" y="8" width="404" height="234" fill="#f1e8d0" stroke="#6d5628"/>`;
  h+=`<path d="${arc(R,0,2)}" stroke="#c4402a" stroke-width="10" fill="none" opacity=".8"/>`;
  h+=`<path d="${arc(R,2,5)}" stroke="#c9932e" stroke-width="10" fill="none" opacity=".72"/>`;
  h+=`<path d="${arc(R,5,N_ROUNDS)}" stroke="#6d8f4a" stroke-width="10" fill="none" opacity=".72"/>`;
  h+=`<path d="${arc(R,0,N_ROUNDS)}" stroke="#20190d" stroke-width="1.4" fill="none"/>`;
  for(let v=0;v<=N_ROUNDS;v++){
    const big=v%5===0, a=pol(R-(big?17:10),v), b=pol(R-1,v);
    h+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#20190d" stroke-width="${big?2:1}"/>`;
    if(big){ const t=pol(R-34,v);
      h+=`<text x="${t[0].toFixed(1)}" y="${(t[1]+5).toFixed(1)}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="14" fill="#20190d">${v}</text>`; }
  }
  // the label rides the green zone itself, the way a meter face is actually printed
  h+=`<defs><path id="zonearc" fill="none" d="${arc(R+13,5,N_ROUNDS)}"/></defs>`;
  h+=`<text font-family="'Saira Condensed',sans-serif" font-weight="700" font-size="10.5" letter-spacing="1.2" fill="#4e6a32">`+
     `<textPath href="#zonearc" startOffset="50%" text-anchor="middle">YOU CAN HEAR IT</textPath></text>`;
  h+=`<text x="${CX}" y="184" text-anchor="middle" font-family="'Saira Condensed',sans-serif" font-weight="700" font-size="13" letter-spacing="3.6" fill="#54462a">CORRECT OF 10</text>`;
  h+=`<line class="needle" id="ndl" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY-R+20}" stroke="#20190d" stroke-width="2.6" transform="rotate(${ang(0)} ${CX} ${CY})"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="10" fill="#20190d"/><circle cx="${CX}" cy="${CY}" r="3.5" fill="#bb9d5c"/>`;
  s.innerHTML=h;
  const move=()=>document.getElementById('ndl').setAttribute('transform',`rotate(${ang(score)} ${CX} ${CY})`);
  matchMedia('(prefers-reduced-motion:reduce)').matches ? move() : setTimeout(move,180);
}

function showResult(){
  $('#s-test').hidden=true; $('#s-result').hidden=false;
  const score=picks.filter(p=>p.ok).length;
  $('#counter').textContent='REPORT';
  drawMeter(score);
  const p=pAtLeast(score,N_ROUNDS,1/N_OPTS);
  const sig=p<0.05;
  $('#verdict').textContent = score<=2 ? 'No better than guessing'
                            : sig ? 'You can hear it' : 'Close, but could be luck';
  $('#stats').innerHTML =
    '<strong>'+score+' of 10 correct.</strong> Guessing at random averages 2. '+
    'The odds of scoring '+score+' or better by pure luck are <span class="mono">'+
    (p<0.001? (p*100).toExponential(1) : (p*100).toFixed(1))+'%</span>. '+
    (sig ? 'That clears the conventional 5% bar, so you are genuinely hearing something.'
         : score<=2 ? 'Nothing here separates you from a coin toss with five sides.'
         : 'Above what a guesser averages, but not far enough above it to rule out luck. '+
           'Five is where the meter turns green.');
  // price bias: what you reached for, against what was actually playing
  const cur=n=>n.toLocaleString('en-US');
  const sgn=n=>n>0?'+':n<0?'−':'';
  const pickE=picks.reduce((t,p)=>t+(p.pick.eur||0),0), realE=rounds.reduce((t,r)=>t+(r.ans.eur||0),0);
  const pickU=picks.reduce((t,p)=>t+(p.pick.usd||0),0), realU=rounds.reduce((t,r)=>t+(r.ans.usd||0),0);
  const dE=pickE-realE, dU=pickU-realU;
  const deltas=rounds.map((r,i)=>(picks[i].pick.eur||0)-(r.ans.eur||0));
  const hi=deltas.filter(d=>d>0).length, lo=deltas.filter(d=>d<0).length, lvl=deltas.length-hi-lo;
  $('#bias').innerHTML =
    '<div class="bias"><div class="silk">Price bias</div>'+
    '<div class="biasval">'+sgn(dE)+'€'+cur(Math.abs(dE))+' / '+sgn(dU)+'$'+cur(Math.abs(dU))+'</div>'+
    '<div class="biasnote">'+
      (dE>0 ? 'You reached for pricier instruments than the ones actually playing.'
      : dE<0 ? 'You reached for cheaper instruments than the ones actually playing.'
             : 'Your picks came out level with the real instruments.')+
      ' Guessed high in '+hi+', low in '+lo+', level in '+lvl+'.</div>'+
    '<div class="spec">Your picks €'+cur(pickE)+' / $'+cur(pickU)+
    ' · actually playing €'+cur(realE)+' / $'+cur(realU)+'</div></div>';

  const tb=$('#tbody'); tb.innerHTML='';
  rounds.forEach((r,i)=>{
    const pk=picks[i], d=deltas[i];
    tb.insertAdjacentHTML('beforeend',
      '<tr><td class="rnum">'+String(i+1).padStart(2,'0')+'</td>'+
      '<td><a href="'+r.ans.url+'" target="_blank" rel="noopener">'+name(r.ans)+'</a></td>'+
      '<td>'+(pk.ok?'<span class="dim">— same</span>':name(pk.pick))+'</td>'+
      '<td class="delta">'+(pk.ok?'—':sgn(d)+'€'+cur(Math.abs(d)))+'</td>'+
      '<td class="mark '+(pk.ok?'y':'n')+'">'+(pk.ok?'✓':'✗')+'</td></tr>');
  });
}

function startTest(scroll){
  rounds=buildRounds(); idx=0; picks=[];
  $('#s-result').hidden=true; $('#s-test').hidden=false;
  renderRound();
  if(scroll!==false) window.scrollTo({top:0,behavior:'smooth'});
}
$('#again').onclick=()=>startTest();
startTest(false);
</script>
</body>
